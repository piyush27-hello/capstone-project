<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify OTP — Piyush Watch</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <div class="ticker">
    <span class="ticker-inner">⌚ PIYUSH WATCH · SECURE VERIFICATION · ENTER YOUR OTP TO CONTINUE ⌚</span>
  </div>

  <header class="header">
    <div class="container header-inner">
      <div class="brand">
        <div class="logo"></div>
        <div class="brand-title"><a href="/index.html">PIYUSH <span>WATCH</span></a></div>
      </div>
    </div>
  </header>

  <div class="verify-otp-page">
    <div class="verify-card">
      <h2 class="verify-title">Verify OTP</h2>
      <p class="verify-subtitle">
        OTP sent to:
        <span class="verify-email" id="otp-email">example@gmail.com</span>
      </p>

      <div id="error" class="otp-error"></div>

      <form id="otp-form" class="otp-form">
        <input
          id="otp"
          class="otp-input"
          type="text"
          maxlength="6"
          placeholder="000000"
          required
        />
        <button type="submit" class="otp-btn">Verify OTP →</button>
      </form>

      <div class="resend-link">
        Didn't receive the code? <a href="#">Resend OTP</a>
      </div>
    </div>
  </div>

  <div class="footer-note">© 2025 Piyush Watch · Premium Timepieces · All Rights Reserved</div>

  <script type="module" src="/js/verify-otp.js"></script>
</body>
</html>
